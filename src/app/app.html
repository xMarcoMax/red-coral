<header>
  <div class="container bar">
    <a class="brand" routerLink="/">
      <img src="logo.png" alt="" width="563" height="640" />
      Red Coral
    </a>
    <nav [attr.aria-label]="'nav.label' | transloco">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.home' | transloco }}</a>
      <a routerLink="/giochi" routerLinkActive="active">{{ 'nav.games' | transloco }}</a>
      <a routerLink="/blog" routerLinkActive="active">{{ 'nav.blog' | transloco }}</a>
      <a routerLink="/chi-siamo" routerLinkActive="active">{{ 'nav.about' | transloco }}</a>
    </nav>
    <app-language-switcher />
  </div>
</header>
<router-outlet />
<footer>
  <div class="container">© {{ year }} Red Coral</div>
</footer>
