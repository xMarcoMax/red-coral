<header>
  <div class="container bar">
    <a class="brand" routerLink="/">
      <img class="symbol" src="images/logo/logo.png" alt="" width="563" height="640" />
      <img class="wordmark" src="images/logo/red-coral-text.svg" alt="Red Coral" width="1935" height="340" />
    </a>
    <nav [attr.aria-label]="'nav.label' | transloco">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.home' | transloco }}</a>
      <a routerLink="/games" routerLinkActive="active">{{ 'nav.games' | transloco }}</a>
      <a routerLink="/blog" routerLinkActive="active">{{ 'nav.blog' | transloco }}</a>
      <a routerLink="/about-us" routerLinkActive="active">{{ 'nav.about' | transloco }}</a>
    </nav>
    <app-language-switcher />
  </div>
</header>
<router-outlet />
<footer>
  <div class="container">© {{ year }} Red Coral</div>
</footer>
